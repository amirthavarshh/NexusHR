spring:
  application:
    name: nexushr-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:nexushrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


security:
  jwt:
    # Base64-encoded secret key (at least 256 bits)
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000 

app:
  notification:
    email:
      enabled: ${APP_NOTIFICATION_EMAIL_ENABLED:false}
      provider: ${APP_NOTIFICATION_EMAIL_PROVIDER:AWS_SES}
    sms:
      enabled: ${APP_NOTIFICATION_SMS_ENABLED:false}
      provider: ${APP_NOTIFICATION_SMS_PROVIDER:Twilio}
