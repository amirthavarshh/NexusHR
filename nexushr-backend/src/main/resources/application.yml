spring:
  application:
    name: nexushr-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexushr}
    username: ${DB_USERNAME:nexushr_user}
    password: ${DB_PASSWORD:nexushr_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


security:
  jwt:
    # Base64-encoded secret key (at least 256 bits)
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000 

app:
  notification:
    email:
      enabled: ${APP_NOTIFICATION_EMAIL_ENABLED:false}
      provider: ${APP_NOTIFICATION_EMAIL_PROVIDER:AWS_SES}
    sms:
      enabled: ${APP_NOTIFICATION_SMS_ENABLED:false}
      provider: ${APP_NOTIFICATION_SMS_PROVIDER:Twilio}
